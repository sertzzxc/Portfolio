  body {
      font-family: 'Poppins', sans-serif;

    #welcomeMessage {
      background-color: #f8f9fa;
      /* Light background for the section */
      border-radius: 10px;

    /* Navbar Link Base Style */
/* Navbar Base */
.navbar-nav .nav-link {
  color: #fff !important;
  position: relative;
  overflow: hidden;
  transition: color 0.3s ease;
}


/* Navbar Link Hover Background */
.navbar-nav .nav-link:hover {
  background-color: #333;
  border-radius: 8px;
  color: #fff !important;
  transform: translateY(-2px);
  box-shadow: 0px 4px 15px rgba(255, 255, 255, 0.2);
}

/* Animated Background Overlay (Underline) */
.navbar-nav .nav-link::before {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 2px;
  background-color: #fff;
  transition: width 0.4s ease-in-out;
}

/* Show underline on hover */
.navbar-nav .nav-link:hover::before {
  width: 100%;
}

/* Hover for Active Link */
.nav-item .nav-link:hover {
  background-color: #444; /* Slightly lighter gray */
  color:black; /* White text */
  transition: background-color 0.4s ease, color 0.3s ease, transform 0.3s ease;
}
 
/* Active Link Glow Effect */
.nav-item .nav-link:hover {
  box-shadow: 0px 4px 15px rgba(255, 255, 255, 0.2); /* Subtle white glow */
}

/* Focus/Active Link Style */
.navbar-nav .nav-link:focus,
.navbar-nav .nav-link:active {
  background-color: #555; /* Medium gray */
  color: #fff;
  outline: none;
  transition: background-color 0.4s ease;
}

/* Card Animation */
.card-body.show {
  max-height: 500px;
}

#welcomeMessage {
  opacity: 0;
  transform: translateY(-20px);
  animation: fadeIn 1s ease-in-out forwards;
}

@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card {
  opacity: 0;
  transform: translateX(-30px);
  animation: slideIn 0.8s ease forwards;
  background-color: #000; /* Black card background */
  border: 1px solid #fff; /* White border */
  color: black; /* White text */
}

@keyframes slideIn {
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

/* Optional: Body background */
body {
  background-color: #000; /* Black background */
  color: #fff; /* Default white text */
}

.cursor {
      display: inline-block;
      margin-left: 2px;
      animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink { to { visibility: hidden; } }

  </style>
</head>
