  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }


    .card {
      width: 100%;
      max-width: 600px;
      /* Limit card width */
      border-radius: 12px;
      /* Rounded corners */
    }

    .card-body {
      text-align: center;
      padding: 30px;
    }

    #navbar {
      transition: all 0.3s ease;
      padding: 1.5rem 1rem;
      /* large padding */
      font-size: 1rem;
    }

    /* Small navbar (when scrolled) */
    #navbar.navbar-small {
      padding: 0.5rem 1rem;
      /* smaller padding */
      font-size: 0.9rem;
    }

    /* Navbar Link Base Style */
    /* Navbar Base */
    .navbar-nav .nav-link {
      color: #fff !important;
      position: relative;
      overflow: hidden;
      transition: color 0.3s ease;
    }


    /* Animated Background Overlay (Underline) */
    .navbar-nav .nav-link::before {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 2px;
      background-color: #fff;
      transition: width 0.4s ease-in-out;
    }

    /* Show underline on hover */
    .navbar-nav .nav-link:hover::before {
      width: 100%;
    }

    /* Hover for Active Link */
    .nav-item .nav-link:hover {
      /* Slightly lighter gray */
      color: black;
      /* White text */
      transition: background-color 0.4s ease, color 0.3s ease, transform 0.3s ease;
    }



    /* Focus/Active Link Style */
    .navbar-nav .nav-link:focus,
    .navbar-nav .nav-link:active {
      background-color: #555;
      /* Medium gray */
      color: #fff;
      outline: none;
      transition: background-color 0.4s ease;
    }



    /* Card Animation */
    .card-body.show {
      max-height: 500px;
    }

    #welcomeMessage {
      opacity: 0;
      transform: translateY(-20px);
      animation: fadeIn 1s ease-in-out forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      opacity: 0;
      transform: translateX(-30px);
      animation: slideIn 0.8s ease forwards;
      background-color: #000;
      /* Black card background */
      border: 1px solid #fff;
      /* White border */
      color: black;
      /* White text */
    }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }


    #about {
      padding-top: 100px;
      box-sizing: border-box;
    }

    html {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* Optional: Body background */
    body {
      background-color: #000;
      /* Black background */
      color: #fff;
      margin: 0;
      padding: 0;
    }



    @keyframes blink {
      to {
        visibility: hidden;
      }
    }

    .construction-container {
      text-align: center;
      padding: 3rem;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      max-width: 480px;
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      animation: float 2s ease-in-out infinite;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }

    p {
      color: #cbd5f5;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #2563eb;
    }

    .construction-wrapper {
        min-height: 100vh;
        padding-top: 100px; /* height of navbar */
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transform: translateY(40px);
        animation: slideUp 0.8s ease-out forwards;
    }

    @keyframes slideUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }


    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
